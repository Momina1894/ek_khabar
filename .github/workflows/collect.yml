# Every 30 min: collect -> cluster -> build site -> publish site/ to GitHub Pages.
#
# The database is NOT committed to git. It used to be, and at ~48 commits a day of
# a growing binary the repo history was the fastest-growing thing in the project.
# It now lives as an asset on the "data" release: restored at the start of a run,
# saved again at the end, with a dated snapshot kept once a day so a bad run can
# be rolled back.
#
# Working on this locally? Either run `python collector.py` a few times to build
# your own, or grab the current one:
#   gh release download data --pattern headlines.db

name: Collect headlines

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Runs queue rather than overlap, so two of them never write the database at once.
concurrency:
  group: collect
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the sentence model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: minilm-v1

      - run: pip install feedparser requests scikit-learn sentence-transformers

      - name: Run tests
        run: python -m unittest discover -v

      - name: Restore database
        run: |
          if gh release download data --pattern headlines.db --clobber 2>/dev/null; then
            echo "restored $(du -h headlines.db | cut -f1) database"
          else
            echo "no database on the data release yet - starting a fresh one"
          fi

      - run: python collector.py
      - run: python cluster.py
      - run: python build.py

      - name: Save database
        run: |
          gh release view data >/dev/null 2>&1 || \
            gh release create data --title "Data" \
              --notes "Rolling headline database. headlines.db is current; dated files are daily snapshots."
          gh release upload data headlines.db --clobber

          # One snapshot a day, so a run that corrupts the database can be undone.
          snap="headlines-$(date -u +'%Y-%m-%d').db"
          if ! gh release view data --json assets --jq '.assets[].name' | grep -qx "$snap"; then
            cp headlines.db "$snap"
            gh release upload data "$snap" --clobber
            echo "snapshot $snap"
          fi

          # Keep the last 14 snapshots.
          gh release view data --json assets --jq '.assets[].name' \
            | grep -E '^headlines-[0-9]{4}-[0-9]{2}-[0-9]{2}\.db$' | sort -r | tail -n +15 \
            | while read -r old; do gh release delete-asset data "$old" -y && echo "pruned $old"; done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
