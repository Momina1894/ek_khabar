# Replaces .github/workflows/collect.yml
# Every 30 min: collect -> cluster -> build site -> commit db -> publish site/ to GitHub Pages

name: Collect headlines

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the sentence model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: minilm-v1

      - run: pip install feedparser requests scikit-learn sentence-transformers

      - run: python collector.py
      - run: python cluster.py
      - run: python build.py

      - name: Commit database
        run: |
          git config user.name "collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add headlines.db
          git diff --cached --quiet || git commit -m "collect: $(date -u +'%Y-%m-%d %H:%M')"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
